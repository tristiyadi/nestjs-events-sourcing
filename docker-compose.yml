services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fast-logic-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - APP_NAME=${APP_NAME:-FastLogicAPI}
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST_DOCKER:-postgres}:5432/${DB_NAME:-transaction_db}
      - REDIS_HOST=${REDIS_HOST_DOCKER:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword123}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-domain-events}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fast-logic-network

  postgres:
    image: postgres:16-alpine
    container_name: fast-logic-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-transaction_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-transaction_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fast-logic-network

  redis:
    image: redis:7-alpine
    container_name: fast-logic-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-devpassword123}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-devpassword123}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fast-logic-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fast-logic-rabbitmq
    restart: unless-stopped
    ports:
      - '${RABBITMQ_PORT:-5673}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15673}:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fast-logic-network

networks:
  fast-logic-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
